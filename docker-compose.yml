#AIRFLOW__DATABASE__SQL_ALCHEMY_CONN:The double underscores (__) map directly to Airflow’s configuration file hierarchy (airflow.cfg), s
    #specifically setting the sql_alchemy_conn parameter under the [database] section.
 #postgresql+psycopg2:This specifies the database driver and dialect. It tells Airflow to connect to a PostgreSQL database
 # using psycopg2, which is the standard Python adapter for PostgreSQL. psycopg2 is used to connect Python programs 
 #to PostgreSQL databases, execute SQL queries, and manage database transactions.
 #@postgres The @ symbol separates the credentials from the network location. postgres is the hostname of the database server.
  # In a Docker Compose setup, this matches the name of the PostgreSQL container service(see its postgres only).
 

 #   airflow-init command description===>sleep=used to wait for a dependent external database container to start up.
  #airflow db init=Initializes a brand-new clean database. Note that in modern Airflow versions, airflow db migrate handles schema creation and upgrades automatically,
     #making db init optional or redundant if migrations are run.
  #airflow db migrate: Applies the latest database migrations and updates the schema structure.
  #airflow users create: Creates an administrator account using the specified environment variables like ${AIRFLOW_ADMIN_USER}


# restart: always=PostgreSQL container instructs the Docker daemon to automatically restart the container
    #whenever it stops or crashes, regardless of the exit code.
    #use Automatic Recovery From Crashes,If the Postgres process crashes due to an out-of-memory error (OOM)
    #Docker will immediately spin the container back up. This minimizes database downtime without requiring manual developer intervention
    #always=restarts when the docker deamon restarts(without explicit command)   vs
    #unless-stopped=it stays stoped indefinintely until you manually start it again, even if the Docker daemon restarts.  

#Postgres environment variable=Define these variables locally in a .env file in the same folder as your docker-compose.yml file so Docker can read them.
      #understand the default cases for POSTGRES_USER and POSTGRES_DB, which are both set to "postgres" if you don't specify them in 
      #the .env file[Defaults to matching the value of POSTGRES_USER if left empty for POSTGRES_DB].
      #POSTGRES_DB Role: Sets the name of the first database created at startup.
      #what does this initial/first database means Immediate Access:start creating tables right away without needing to manually run a CREATE DATABASE
      #Automate:automate your environment setup in scripts or Docker Compose files.
      #One-Time Action:This database is only created on the initial startup of the container when the data folder is completely empty. It will not be recreated or altered on subsequent restarts
